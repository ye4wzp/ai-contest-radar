name: Update competition data

on:
  schedule:
    - cron: "30 0 * * *" # 每天 08:30 北京时间
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch sources
        working-directory: scripts
        # competehub 有 Cloudflare 挑战，需在 xvfb 中驾驭有头 Chrome 过一次；任一源失败都不中断，沿用上次结果
        run: |
          xvfb-run -a python fetch_competehub.py 50 || echo "::warning::competehub fetch failed"
          python fetch_tencent.py || echo "::warning::tencent fetch failed"
          python fetch_mlh.py || echo "::warning::mlh fetch failed"
      - run: python scripts/build_data.py
      - name: Deadline reminders
        run: python scripts/notify.py || echo "::warning::notify failed"
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "chore: daily data update $(date -u +%F)"; git push; }
      - name: Failure alert
        if: failure()
        run: python scripts/notify.py --fail "每日抓取失败，请检查 Actions 日志"
